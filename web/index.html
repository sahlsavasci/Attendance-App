<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="attendance_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>attendance_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Deteksi wajah untuk versi browser. ML Kit tidak tersedia di web, jadi dipakai
    MediaPipe Face Detector (model BlazeFace yang sama dengan ML Kit).
    Dipanggil dari lib/utils/face_detection/face_check_web.dart.
  -->
  <script>
    (function () {
      const MP_VERSION = "0.10.14";
      const MP_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@" + MP_VERSION;
      const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";
      let detectorPromise = null;

      function getDetector() {
        if (!detectorPromise) {
          detectorPromise = (async () => {
            const vision = await import(MP_BASE + "/vision_bundle.mjs");
            const fileset = await vision.FilesetResolver.forVisionTasks(MP_BASE + "/wasm");
            return vision.FaceDetector.createFromOptions(fileset, {
              baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
              runningMode: "IMAGE",
              minDetectionConfidence: 0.5,
            });
          })().catch((err) => {
            detectorPromise = null; // izinkan coba lagi, misalnya setelah internet kembali
            throw err;
          });
        }
        return detectorPromise;
      }

      window.faceCheckWarmUp = function () {
        return getDetector().then(() => true);
      };

      window.faceCheckCount = async function (imageUrl) {
        const detector = await getDetector();
        const img = new Image();
        img.src = imageUrl;
        await img.decode();
        return detector.detect(img).detections.length;
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
